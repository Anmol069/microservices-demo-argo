apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Anmol069/microservices-demo.git
    targetRevision: feature/Coupon
    path: release

  destination:
    server: https://kubernetes.default.svc
    namespace: boutique

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
